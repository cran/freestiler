[package]
name = "freestiler-core"
version = "0.1.0"
edition = "2021"
description = "Core Rust engine for building PMTiles vector tilesets"
license = "MIT"
publish = false

[features]
default = []

[dependencies]
geo = "0.29"
geo-types = "0.7"
prost = "0.13"
pmtiles2 = "0.3"
integer-encoding = "4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
